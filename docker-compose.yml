services:

  # Cria o serviço responsável pelo banco PostgreSQL.
  postgres:

    # Define a imagem oficial do PostgreSQL.
    image: postgres:17

    # Nome do container do PostgreSQL da nossa aula.
    container_name: postgres_aula_superset

    # Reinicia automaticamente caso o container pare.
    restart: unless-stopped

    # Configurações iniciais do PostgreSQL.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-db_vendas}

    # Porta do Windows : Porta interna do PostgreSQL.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"

    # Volume responsável pela persistência dos dados.
    volumes:
      - postgres_data:/var/lib/postgresql/data


# Volume persistente do PostgreSQL.
volumes:
  postgres_data:
