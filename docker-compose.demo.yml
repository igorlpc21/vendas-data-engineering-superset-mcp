# Stack independente: docker compose -p vendas-demo -f docker-compose.demo.yml ...
x-superset: &superset
  image: vendas-superset-mcp:6.1.0
  build:
    context: .
    dockerfile: config/Dockerfile.superset
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Preencha SUPERSET_SECRET_KEY no .env}
    SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Preencha SUPERSET_ADMIN_PASSWORD no .env}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
    DEMO_SUPERSET_PORT: ${DEMO_SUPERSET_PORT:-18888}
  volumes:
    - ./config/superset_config.py:/app/pythonpath/superset_config.py:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-db_vendas}
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_PORT:-15434}:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./config/create-metadata-db.sql:/docker-entrypoint-initdb.d/00-metadata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  superset-init:
    <<: *superset
    command:
      - /bin/sh
      - -ec
      - |
        superset db upgrade
        superset fab create-admin --username "$$SUPERSET_ADMIN_USER" --firstname Demo --lastname Vendas --email demo@example.invalid --password "$$SUPERSET_ADMIN_PASSWORD"
        superset init
  superset:
    <<: *superset
    command: ["gunicorn", "--bind", "0.0.0.0:8088", "--workers", "2", "--timeout", "120", "superset.app:create_app()"]
    ports:
      - "127.0.0.1:${DEMO_SUPERSET_PORT:-18888}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
  superset-mcp:
    <<: *superset
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    ports:
      - "127.0.0.1:${DEMO_MCP_PORT:-15008}:5008"
    depends_on:
      superset-init:
        condition: service_completed_successfully
volumes:
  demo_postgres_data:
